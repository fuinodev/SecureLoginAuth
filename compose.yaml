
services:
  postgres:
    image: postgres:17
    container_name: secureloginauth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: securelogin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: secureloginauth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securelogin -d secureloginauth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
